[platformio]
; src_dir = examples/factory
; src_dir = examples/mt6816
src_dir = examples/tmc2209

[env:pico32]
platform = espressif32@6.12.0
board = pico32
framework = arduino
upload_speed = 460800
monitor_speed = 115200
board_build.partitions = no_ota.csv
